name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Branch pushes already run CI; pull requests run it here only when they come from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Installs the pnpm version pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The test suites run against this compiled Worker.
      - name: Build
        run: pnpm build

      # Each suite uses disposable local D1/R2 bindings and local fixtures; no paid service is contacted.
      - name: Integration tests
        run: pnpm test:integration

      - name: Security regression tests
        run: pnpm test:security

      - name: Provider contract tests
        run: pnpm test:providers

      - name: Production configuration tests
        run: pnpm test:production

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
